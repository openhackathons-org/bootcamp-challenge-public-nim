[project]
name = "mcp-server-invoice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tagekezo", email = "tagekezo@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=15.4.0",
    "fastmcp>=3.4.4",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.9",
    "mcp[cli]>=1.28.1",
    "nvidia-nat[eval]>=1.8.0",
    "nvidia-nat[langchain]>=1.8.0",
    "nvidia-nat[mcp]>=1.8.0",
    "nvidia-nat[phoenix]>=1.8.0",
    "nvidia-nat[profiling]>=1.8.0",
    "strictyaml>=1.7.3",
]

[project.scripts]
mcp-server-invoice = "mcp_server_invoice:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
